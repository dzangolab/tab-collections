<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Collection</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topnav">
  <div class="topnav-inner">
    <img src="icons/icon128.png" alt="">
    <h1>Tab Collections</h1>
    <div class="spacer"></div>
    <a class="back" href="collections.html" id="back">All collections</a>
  </div>
</header>
<main class="narrow">
  <div id="notFound" class="panel empty" hidden>
    This collection no longer exists. <a href="collections.html">Back to all collections</a>
  </div>

  <div id="editor" hidden>
    <div id="external" class="banner" hidden>
      This collection was changed elsewhere while you were editing.
      <a href="#" id="reload">Discard my edits and reload</a>
    </div>

    <div class="doc-head">
      <h2 id="title"></h2>
      <div class="toolbar">
        <button class="icon-btn" id="editToggle" aria-pressed="false" aria-controls="details" aria-label="Edit name and description" title="Edit name and description"></button>
        <button class="icon-btn" id="exportOne" aria-label="Export" title="Export"></button>
        <button id="open" class="primary">Open collection</button>
      </div>
    </div>
    <p class="doc-desc" id="descText"></p>
    <section class="panel details" id="details" hidden>
      <h3>Details</h3>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" maxlength="200">
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" placeholder="What is this collection for?"></textarea>
      </div>
    </section>
    <div class="doc-meta">
      <p id="dates"></p>
      <button class="icon-btn ghost danger" id="delete" aria-label="Delete collection" title="Delete collection"></button>
    </div>
    <div id="drift"></div>

    <h2 class="section-label" id="count"></h2>
    <div class="page-list" id="pages"></div>
    <div id="noPages" class="panel empty" hidden>No pages yet — add one below: a collection needs at least one.</div>
    <form class="addcard" id="addForm">
      <input type="text" class="url" id="addUrl" placeholder="Add a page: https://example.com" aria-label="New page URL" required>
      <input type="text" class="title" id="addTitle" placeholder="Title (optional)" aria-label="New page title">
      <button type="submit">Add page</button>
    </form>
  </div>
</main>
<div class="savepill" id="savebar" role="status" hidden>
  <span class="status" id="status">Unsaved changes</span>
  <button class="revert" id="revert">Revert</button>
  <button class="revert" id="cancel" hidden>Cancel</button>
  <button id="save" class="primary">Save</button>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="collection.js"></script>
</body>
</html>
