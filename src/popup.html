<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 320px; }
    .wrap { padding: 12px; }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .head h1 { font-size: 15px; }
    .list { max-height: 320px; overflow: auto; margin: 0 -12px; }
    .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 8px 12px; background: transparent; cursor: pointer; }
    .item:hover { background: var(--hover); }
    .item .main { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
    .item .mark { flex: none; width: 1ch; }
    .item .n { color: var(--muted); font-size: 12px; min-width: 2ch; text-align: right; }
    .item .drift { position: relative; padding: 0 2px; border: 0; border-radius: 4px; background: transparent; font: inherit; font-size: 12px; color: var(--text); cursor: pointer; }
    .item .drift:hover { background: var(--border); }
    .item .drift .badge { position: absolute; top: -9px; right: -9px; width: 13px; height: 12px; }
    .item .drift .tri { fill: #f5b800; stroke: #b98a00; stroke-width: 1; stroke-linejoin: round; }
    .item .drift .excl { stroke: #3a2a00; stroke-width: 1.8; stroke-linecap: round; }
    .item .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .switch { position: relative; flex: none; width: 28px; height: 16px; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch .slider { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .15s; pointer-events: none; }
    .switch .slider::before { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(12px); }
    .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
    .section { border-top: 1px solid var(--border); margin: 8px -12px 0; padding: 10px 12px 0; }
    .row { display: flex; gap: 6px; }
    .current { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .banner { margin: 0 0 8px; padding: 6px 10px; font-size: 12px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Collections</h1>
    <a href="#" id="manage">Manage →</a>
  </div>
  <div class="list" id="list"></div>
  <div class="section">
    <div class="current" id="current"></div>
    <form class="row" id="saveForm">
      <input type="text" id="saveName" placeholder="Name for this window's tabs">
      <button type="submit" class="primary">Save</button>
    </form>
    <div id="collectionSection" hidden>
      <div class="current" id="collectionMsg"></div>
      <button type="button" class="primary" id="saveChanges" hidden>Save changes…</button>
    </div>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
